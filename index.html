<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>白き牛の道 — Bealach na Bó Finne</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #080d0c;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
        overscroll-behavior: none;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
        touch-action: none;
        outline: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        opacity: 0;
        transition: opacity 2.4s ease;
      }
      body.is-ready #scene {
        opacity: 1;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }
      #boot-error {
        position: fixed;
        inset: auto 16px 24px 16px;
        color: #cfd8e6;
        font: 14px/1.6 system-ui, sans-serif;
        text-align: center;
      }
      [hidden] {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        #scene {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="インタラクティブな星祭の情景"></canvas>
    <div id="hud"></div>
    <p id="boot-error" hidden></p>
    <!-- BUILD:SCRIPT_START -->
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
    <!-- BUILD:SCRIPT_END -->
  </body>
</html>
